name: mustm3
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: '>=3.0.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
 
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.21
  webview_flutter: ^4.10.0
  youtube_explode_dart: ^2.3.5
  youtube_player_flutter: ^9.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  dio: ^5.4.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3
  video_thumbnail: ^0.5.3
  on_audio_query: ^2.9.0
  video_player: ^2.9.2
  file_picker: ^8.1.4
  url_launcher: ^6.3.0
  http: ^1.2.0
  image_gallery_saver_plus: ^4.0.1
  flutter_dynamic_icon: ^2.1.0
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal.ttf

    - family: mzghrf
      fonts:
        - asset: assets/fonts/mzghrf.ttf

    - family: zen
      fonts:
        - asset: assets/fonts/zen.ttf

# ─────────────────────────────────────────────
# Flutter Native Splash Configuration
# ─────────────────────────────────────────────
flutter_native_splash:

  image: assets/images/logo.png
  color: "#ffffff"

  image_dark: assets/images/logo.png
  color_dark: "#0d0d0d"


  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"

    # Dark Mode على Android 12
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#0d0d0d"

  android: true
  ios: true
  web: false

# ─────────────────────────────────────────────
# Flutter Launcher Icons Configuration
# ─────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-white.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon-white.png"